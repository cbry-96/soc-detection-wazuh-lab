<!--
  FIM (File Integrity Monitoring) en tiempo real
  Archivo de destino: /var/ossec/etc/ossec.conf  (en TARGET)
  Fuente: documentación oficial de Wazuh (File Integrity Monitoring)

  El agente ya trae un bloque <syscheck> por defecto que monitoriza /etc, pero sin
  realtime. Edita ese bloque y añade/ajusta estas entradas para vigilar en tiempo
  real los ficheros que toca el ataque. Evita duplicar la entrada /etc existente:
  modifícala para añadir realtime="yes" report_changes="yes".

  Tras editar:  sudo systemctl restart wazuh-agent
-->

<syscheck>
  <!-- /etc en tiempo real con registro del cambio de contenido (verás el useradd) -->
  <directories realtime="yes" check_all="yes" report_changes="yes">/etc</directories>

  <!-- Configuración del servicio SSH -->
  <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ssh</directories>

  <!-- Tareas cron del sistema (persistencia) -->
  <directories realtime="yes" check_all="yes">/etc/cron.d</directories>
</syscheck>

<!--
  Qué dispara cada acción del ataque:
    - useradd attacker  -> cambio en /etc/passwd  -> alerta FIM (regla 550, fichero
      modificado). Con report_changes se ve la línea añadida.  MITRE T1136.001
    - edición sshd_config -> cambio en /etc/ssh/sshd_config -> alerta FIM 550.  T1098
    - fichero nuevo en /etc/cron.d -> alerta FIM 554 (fichero añadido).  T1053.003

  check_all="yes": verifica hash, tamaño, permisos, propietario, etc.
  realtime="yes": notifica al instante (requiere inotify, disponible en Linux).
-->
