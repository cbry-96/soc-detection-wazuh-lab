<!--
  Respuesta activa: bloqueo de fuerza bruta SSH con firewall-drop
  Archivo de destino: /var/ossec/etc/ossec.conf  (en WAZUH-SRV)
  Fuente: documentación oficial de Wazuh (Active Response — Blocking SSH brute-force)

  Pasos:
    1. Verificar que el bloque <command> "firewall-drop" ya existe por defecto
       dentro de <ossec_config>. Si está, NO lo dupliques (se muestra aquí solo
       como referencia).
    2. Añadir el bloque <active-response> dentro de <ossec_config>.
    3. Reiniciar el manager:  sudo systemctl restart wazuh-manager
-->

<!-- (Referencia) Comando por defecto. Verifícalo, no lo dupliques. -->
<command>
  <name>firewall-drop</name>
  <executable>firewall-drop</executable>
  <timeout_allowed>yes</timeout_allowed>
</command>

<!-- Añadir este bloque: dispara firewall-drop cuando salta la regla 5763 -->
<active-response>
  <disabled>no</disabled>
  <command>firewall-drop</command>
  <location>local</location>
  <rules_id>5763</rules_id>
  <timeout>180</timeout>
</active-response>

<!--
  Notas:
  - rule 5763 = "SSHD brute force trying to get access to the system".
  - location "local": la acción se ejecuta en el endpoint monitorizado (TARGET),
    que usa iptables para bloquear la IP de origen (KALI) durante 180 s.
  - La ejecución de la respuesta activa genera a su vez la alerta de regla 651
    ("Host Blocked by firewall-drop Active Response"), visible en el dashboard.
  - Log de respuestas activas en el endpoint: /var/ossec/logs/active-responses.log
-->
